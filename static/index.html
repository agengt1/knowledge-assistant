<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库助手</title>
<style>
  :root { --bg: #1a1a2e; --card: #16213e; --accent: #0f3460; --text: #e0e0e0; --border: #2a2a4a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  /* 侧边栏 */
  .sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
  .sidebar h2 { font-size: 18px; margin-bottom: 20px; }
  .upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; transition: .2s; }
  .upload-area:hover { border-color: #4fc3f7; }
  .upload-area.drag-over { border-color: #4fc3f7; background: rgba(79,195,247,.1); }
  .upload-area input { display: none; }
  .file-list { flex: 1; overflow-y: auto; }
  .file-item { padding: 10px; border-radius: 6px; margin-bottom: 5px; background: var(--bg); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .file-item button { background: none; border: none; color: #f44336; cursor: pointer; font-size: 16px; }
  /* 主区域 */
  .main { flex: 1; display: flex; flex-direction: column; }
  .chat-area { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin-bottom: 16px; max-width: 80%; }
  .msg.user { margin-left: auto; }
  .msg.assistant { margin-right: auto; }
  .msg .content { padding: 12px 16px; border-radius: 12px; line-height: 1.6; }
  .msg.user .content { background: var(--accent); }
  .msg.assistant .content { background: var(--card); white-space: pre-wrap; }
  .msg .source { font-size: 11px; color: #888; margin-top: 4px; }
  .input-area { padding: 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .input-area input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; }
  .input-area input:focus { border-color: #4fc3f7; }
  .input-area button { padding: 12px 24px; border-radius: 8px; border: none; background: #4fc3f7; color: #000; font-weight: bold; cursor: pointer; font-size: 15px; }
  .input-area button:hover { opacity: .9; }
  .status { padding: 8px 20px; font-size: 12px; color: #888; }
</style>
</head>
<body>

<!-- 侧边栏：文件上传 -->
<div class="sidebar">
  <h2>📚 知识库</h2>
  <div class="upload-area" id="uploadArea">
    <p>📂 点击或拖拽上传</p>
    <p style="font-size:11px;color:#888;margin-top:5px;">支持 PDF / TXT / MD</p>
    <input type="file" id="fileInput" accept=".pdf,.txt,.md,.markdown">
  </div>
  <div class="file-list" id="fileList"></div>
</div>

<!-- 主区域：聊天 -->
<div class="main">
  <div class="status" id="status">🟢 就绪</div>
  <div class="chat-area" id="chatArea">
    <div class="msg assistant">
      <div class="content">你好！上传文档后，我可以基于文档内容回答你的问题。</div>
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="msgInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>

<script>
// ── 文件上传 ──────────────────────────────
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const fileList = document.getElementById('fileList');
const status = document.getElementById('status');

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('drag-over');
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) uploadFile(fileInput.files[0]);
});

async function uploadFile(file) {
  status.textContent = '⏳ 上传中...';
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (data.ok) {
      status.textContent = `✅ ${data.doc.filename} 上传成功`;
      loadDocs();
    } else {
      status.textContent = '❌ 上传失败';
    }
  } catch (e) {
    status.textContent = '❌ 上传失败: ' + e.message;
  }
}

async function loadDocs() {
  const res = await fetch('/api/documents');
  const data = await res.json();
  fileList.innerHTML = data.documents.map(d =>
    `<div class="file-item">
      <span>📄 ${d.filename} <br><small>${(d.size/1024).toFixed(1)} KB</small></span>
      <button onclick="delDoc('${d.id}')">✕</button>
    </div>`
  ).join('');
}

async function delDoc(id) {
  await fetch(`/api/documents/${id}`, { method: 'DELETE' });
  loadDocs();
}

// ── 聊天 ──────────────────────────────────
const chatArea = document.getElementById('chatArea');
const msgInput = document.getElementById('msgInput');
let history = [];

function addMsg(role, text, sources) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="content">${text}</div>` + (sources ? `<div class="source">${sources}</div>` : '');
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

async function send() {
  const text = msgInput.value.trim();
  if (!text) return;

  addMsg('user', text);
  msgInput.value = '';
  status.textContent = '⏳ 思考中...';

  // 显示一个助手消息气泡，准备流式填充
  const assistantDiv = addMsg('assistant', '');
  const contentDiv = assistantDiv.querySelector('.content');

  try {
    const res = await fetch('/api/chat/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          if (data.startsWith('[ERROR]')) {
            fullText += '⚠️ ' + data.slice(8);
          } else {
            fullText += data;
          }
          contentDiv.textContent = fullText;
          chatArea.scrollTop = chatArea.scrollHeight;
        }
      }
    }

    history = [...history, { role: 'user', content: text }, { role: 'assistant', content: fullText }];
    // 只保留最近 10 轮
    if (history.length > 20) history = history.slice(-20);
    status.textContent = '🟢 就绪';

  } catch (e) {
    contentDiv.textContent = '发生错误：' + e.message;
    status.textContent = '❌ 出错了';
  }
}

// 初始加载
loadDocs();
</script>
</body>
</html>
